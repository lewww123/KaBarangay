opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=20000
; Deployments replace the container, so PHP files stay fixed during its life.
opcache.validate_timestamps=0
realpath_cache_size=4096K
realpath_cache_ttl=600
; Registration accepts up to four 5 MB identity/proof files in one request.
; Keep PHP's transport limits above Laravel's per-file validation limits.
upload_max_filesize=8M
post_max_size=32M
