[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/kabarangay-supervisord.pid

[program:web]
command=/usr/local/bin/apache2-foreground
priority=10
autostart=true
autorestart=true
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:resident-updates]
command=/usr/local/bin/php /var/www/html/artisan queue:work --queue=resident-updates --sleep=3 --tries=3 --timeout=60 --max-time=3600
directory=/var/www/html
user=www-data
priority=20
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
